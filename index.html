<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Pay Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="tpay-login-box" id="tpay-login-box">
        <h1>WELCOME BACK !!</h1>
        <i class="fa-solid fa-handshake"></i>
        <h2>Login <i class="fa-solid fa-person-walking-arrow-right"></i> T.Pay</h2>
        <p>Welcome back buddy !!. It's been a while..</p>
        <form id="login-form">
            <label for="email">Email</label>
            <div class="email-input">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <label for="password">Password</label>
            <div class="password-input">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit">Login <i class="fa-solid fa-user-lock"></i></button>
            <div class="email-login-cta" id="email-login-cta">
                <p class="forgot-password"><a href="#">Forgot Password?</a></p>
                <label for="remember-me" class="remember-me">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    Remember Me
                </label>
            </div>
        </form>
        <div class="login-divider">OR</div>
        <h3>Login with</h3>
        <div class="social-login-icons">
            <a href="https://accounts.google.com/o/oauth2/auth"><i class="fa-brands fa-google"></i></a>
            <a href="https://www.facebook.com/v2.12/dialog/oauth"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://api.x.com/oauth/authenticate"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://appleid.apple.com/auth/authorize"><i class="fa-brands fa-apple"></i></a>
        </div>
        <p class="signup-link">Don't have an account? <a href="#">Get started</a></p>
    </div>
</body>

</html>
