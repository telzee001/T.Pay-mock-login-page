<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Pay Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="tpay-login-box" id="tpay-login-box">
        <header>
            <section class="welcome-back-section" id="welcome-back-section">
                <h1>WELCOME BACK !!</h1>
                <i class="fa-solid fa-handshake"></i>
                <h2>Login <i class="fa-solid fa-person-walking-arrow-right"></i> T.Pay</h2>
                <p>Welcome back buddy !!. It's been a while..</p>
            </section>
        </header>
        <main>
            <section class="email-login-section">
                <form id="tpay-login-form" class="tpay-login-form">
                    <div class="email-input" id="email-input">
                        <label for="email" class="email">Email</label>
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="password-input" id="password-input">
                        <label for="password" class="password">Password</label>
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Enter password">
                    </div>
                    <button type="submit">Login <i class="fa-solid fa-user-lock"></i></button>
                    <div class="email-login-cta" id="email-login-cta">
                        <p class="forgot-password"><a href="#">Forgot Password</a></p>
                        <label for="remember-me" class="remember-me">
                            <input type="checkbox" id="remember-me" name="remember-me">
                            Remember Me
                        </label>
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <section class="other-login-actions" id="other-login-actions">
                <div class="login-divider">OR</div>
                <div class="social-login-icons">
                    <i class="fa-brands fa-google"></i>
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-x-twitter"></i>
                    <i class="fa-brands fa-apple"></i>
                </div>
                <p class="signup-link" id="sign-up">Don't have an account? <a href="#">Get started here</a></p>
            </section>
        </footer>
    </div>
</body>

</html>
